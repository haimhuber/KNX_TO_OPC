<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ABB KNX Dashboard</title>

  <style>
    :root {
      --abb-red: #ff000f;
      --abb-dark: #0b1720;
      --muted: #6b7280;
      --ok: #15803d;
      --warning: #ca8a04;
      --error: #dc2626;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0f1720, #071021);
      color: #e5e7eb;
    }

    .app-header {
      background: linear-gradient(135deg, #111, #2a2a2a);
      padding: 20px 36px;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      color: var(--abb-red);
      font-size: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 20px;
    }

    .grid {
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px;
      color: #0b1720;
      box-shadow: 0 18px 45px rgba(0,0,0,0.18);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 18px;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(14,20,30,0.04);
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #fff7f7;
    }

    button {
      background: var(--abb-red);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    button.ghost {
      background: transparent;
      border: 1px solid var(--abb-red);
      color: #772a2a;
    }

    .status-ok {
      color: var(--ok);
      font-weight: 800;
    }

    .status-timeout {
      color: var(--warning);
      font-weight: 800;
    }

    .status-err {
      color: var(--error);
      font-weight: 800;
    }

    .status-unknown {
      color: var(--muted);
      font-weight: 800;
    }

    .status-offline {
      color: var(--error);
      font-weight: 800;
    }

    .status-badge {
      display: inline-block;
      min-width: 68px;
      padding: 2px 6px;
      border-radius: 10px;
      background: #f8fafb;
      text-align: center;
      font-size: 11px;
      position: relative;
      line-height: 1;
    }

    /* small colored indicator on the left of the badge */
    .status-badge::before {
      content: '';
      position: absolute;
      left: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.03) inset;
    }
    .status-badge.status-ok::before { background: var(--ok); }
    .status-badge.status-err::before { background: var(--error); }
    .status-badge.status-timeout::before { background: var(--warning); }
    .status-badge.status-unknown::before { background: #9ca3af; }

    /* compact modern table visuals */
    table {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(2,6,23,0.08);
      background: linear-gradient(180deg,#ffffff,#fbfbfd);
    }
    tbody tr { transition: transform 140ms ease, background 140ms ease; }
    tbody tr:hover { transform: translateX(6px); background: linear-gradient(90deg, rgba(255,240,240,0.6), rgba(255,255,255,0.5)); }

    .summary {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .summary-box {
      background: #111827;
      color: #fff;
      border-radius: 10px;
      padding: 12px 16px;
      min-width: 140px;
    }

    .summary-number {
      font-size: 24px;
      font-weight: 900;
      color: var(--abb-red);
    }

    .summary-label {
      font-size: 12px;
      color: #d1d5db;
    }

    .last-update {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 12px;
    }

    .sse-indicator {
      font-size: 13px;
      color: #fff;
      opacity: 0.9;
      margin-top: 6px;
    }

    .sse-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #6b7280;
      border-radius: 50%;
      margin-right: 6px;
    }

    .sse-dot.connected {
      background: #22c55e;
    }

    .sse-dot.error {
      background: var(--abb-red);
    }
    .faults-title {
      color: #8b0000; /* dark red */
      font-weight: 900;
      text-shadow: 0 1px 0 rgba(0,0,0,0.4);
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-content">
      <div>
        <div style="font-size:13px;letter-spacing:2px;font-weight:700;color:#fff;opacity:0.9">
          ABB STYLE TOOL
        </div>

        <h1>KNX Dashboard — Group Address Monitoring</h1>

        <div class="sse-indicator">
          <span id="sseDot" class="sse-dot"></span>
          <span id="sseText">Connecting...</span>
        </div>
      </div>

      <div style="display:flex;gap:10px;align-items:center">
        <button id="backBtn" class="ghost">Back to Config</button>
      </div>
    </div>
  </header>

  <!-- Password modal -->
  <div id="pwModal" style="display:none;position:fixed;left:0;top:0;right:0;bottom:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);z-index:60;">
    <div style="background:#fff;padding:18px;border-radius:10px;min-width:320px;box-shadow:0 12px 40px rgba(0,0,0,0.5)">
      <div style="font-weight:800;color:#111;margin-bottom:8px">Enter password to open Config</div>
      <input id="pwInput" type="password" style="width:100%;padding:8px;border-radius:6px;border:1px solid #ddd;margin-bottom:10px" autofocus/>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button id="pwCancel" class="ghost" style="background:transparent;color:#111;border:1px solid #ccc">Cancel</button>
        <button id="pwOk" style="background:#111;color:#fff">Open</button>
      </div>
      <div id="pwError" style="color:#dc2626;margin-top:8px;display:none">Invalid password</div>
    </div>
  </div>

  <main class="container">
    <div class="grid">
      <div id="content" class="card">
        Loading configuration...
      </div>

      <aside id="faultsPanel" class="card" style="width:920px;min-width:260px;max-height:70vh;overflow:auto;">
        <h3 class="faults-title" style="margin-top:0">Faulted Points</h3>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <label style="color:#6b7280;font-weight:700;font-size:13px;margin-right:6px">Filter GW:</label>
          <select id="gwFilterSelect" style="padding:6px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;color:#111">
            <option value="">All</option>
          </select>
          <button id="gwFilterClear" class="ghost" style="margin-left:auto">Clear</button>
        </div>
        <div id="faultsEmpty" style="color:#6b7280">No faults</div>
        <table id="faultsTable" style="width:100%;display:none;margin-top:8px;">
          <thead>
            <tr>
              <th style="width:12%">GA</th>
              <th style="width:18%">GW</th>
              <th style="width:40%">Name</th>
              <th style="width:18%">Status</th>
              <th style="width:12%">Time</th>
            </tr>
          </thead>
          <tbody id="faultsBody"></tbody>
        </table>
      </aside>
    </div>
  </main>

  <script>
    let currentConfig = null;

    let lastStatus = {
      updated: null,
      points: []
    };

    // map key -> ISO timestamp when the fault was first seen
    let faultFirstSeen = new Map();

    let lastLiveUpdateTime = Date.now();
    let dashboardIsStale = false;

    const STALE_TIMEOUT_MS = 15000;

    function safeId(value) {
      return String(value).replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    function getPointKey(ip, ga) {
      return `${ip}__${ga}`;
    }

    function getStatusElementId(ip, ga) {
      return `status-${safeId(ip)}-${safeId(ga)}`;
    }

    function getStatusInfo(status) {
      if (status === 1) {
        return {
          cls: 'status-ok',
          text: 'OK'
        };
      }

      if (status === -1) {
        return {
          cls: 'status-err',
          text: 'Communication Error'
        };
      }

      if (status === 99) {
        return {
          cls: 'status-timeout',
          text: 'Timeout'
        };
      }

      return {
        cls: 'status-unknown',
        text: 'Unknown'
      };
    }

    // Format ISO timestamp in Israel timezone (Asia/Jerusalem)
    function formatIsrael(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleString('en-IL', { timeZone: 'Asia/Jerusalem' });
      } catch {
        return iso;
      }
    }

    async function loadInitialData() {
      try {
        const [cfgRes, statusRes] = await Promise.all([
          fetch('/api/config'),
          fetch('/api/status')
        ]);

        currentConfig = await cfgRes.json();
        lastStatus = await statusRes.json();

        renderDashboard();
      } catch (err) {
        console.error('Failed to load dashboard data:', err);
        setSseState('error', 'Server unavailable');
      }
    }

    function buildStatusMap() {
      const map = new Map();

      for (const point of lastStatus.points || []) {
        map.set(getPointKey(point.ip, point.ga), point);
      }

      return map;
    }

    function renderDashboard() {
      const content = document.getElementById('content');

      if (
        !currentConfig ||
        !Array.isArray(currentConfig.gateways) ||
        !currentConfig.gateways.length
      ) {
        content.innerHTML = '<div style="color:#6b7280">No config found</div>';
        return;
      }

      const statusMap = buildStatusMap();

      let total = 0;
      let ok = 0;
      let timeout = 0;
      let error = 0;
      let unknown = 0;

      for (const gateway of currentConfig.gateways) {
        for (const point of gateway.points) {
          total++;

          const statusPoint = statusMap.get(getPointKey(gateway.IPRS, point.ga));
          const status = statusPoint ? statusPoint.status : null;

          if (status === 1) ok++;
          else if (status === 99) timeout++;
          else if (status === -1) error++;
          else unknown++;
        }
      }

      let html = `
        <div class="summary">
          <div class="summary-box">
            <div id="sumTotal" class="summary-number">${total}</div>
            <div class="summary-label">Total Points</div>
          </div>

          <div class="summary-box">
            <div id="sumOk" class="summary-number">${ok}</div>
            <div class="summary-label">OK</div>
          </div>

          <div class="summary-box">
            <div id="sumTimeout" class="summary-number">${timeout}</div>
            <div class="summary-label">Timeout</div>
          </div>

          <div class="summary-box">
            <div id="sumError" class="summary-number">${error}</div>
            <div class="summary-label">Communication Error</div>
          </div>

          <div class="summary-box">
            <div id="sumUnknown" class="summary-number">${unknown}</div>
            <div class="summary-label">Unknown</div>
          </div>
        </div>
      `;

      for (const gateway of currentConfig.gateways) {
        html += `<h3 style="margin-top:0">Gateway ${gateway.IPRS}</h3>`;

        html += `
          <table>
            <thead>
              <tr>
                <th>GA</th>
                <th>Name</th>
                <th>Status</th>
                <th>Last Point Update</th>
              </tr>
            </thead>
            <tbody>
        `;

        for (const point of gateway.points) {
          const statusPoint = statusMap.get(getPointKey(gateway.IPRS, point.ga));
          const statusValue = statusPoint ? statusPoint.status : null;
          const info = getStatusInfo(statusValue);

          html += `
            <tr>
              <td>${point.ga}</td>
              <td>${point.dst || ''}</td>
              <td>
                <span
                  id="${getStatusElementId(gateway.IPRS, point.ga)}"
                  class="status-badge ${info.cls}"
                  data-status="${statusValue ?? ''}"
                >
                  ${info.text}
                </span>
              </td>
              <td id="updated-${safeId(gateway.IPRS)}-${safeId(point.ga)}">
                ${statusPoint?.updated ? formatIsrael(statusPoint.updated) : ''}
              </td>
            </tr>
          `;
        }

        html += `
            </tbody>
          </table>
        `;
      }

      html += `
        <div id="lastUpdate" class="last-update">
          Last system update: ${lastStatus.updated ? formatIsrael(lastStatus.updated) : 'n/a'}
        </div>
      `;

      content.innerHTML = html;

      populateGwFilter();
      refreshFaultsPanel();
    }

    let gwFilter = '';

    function populateGwFilter() {
      const sel = document.getElementById('gwFilterSelect');
      if (!sel) return;
      // clear existing options except All
      sel.innerHTML = '<option value="">All</option>';
      if (!currentConfig || !Array.isArray(currentConfig.gateways)) return;
      for (const gw of currentConfig.gateways) {
        const opt = document.createElement('option');
        opt.value = gw.IPRS;
        opt.text = gw.IPRS;
        sel.appendChild(opt);
      }

      sel.value = gwFilter || '';

      sel.onchange = () => {
        gwFilter = sel.value || '';
        refreshFaultsPanel();
      };

      const clearBtn = document.getElementById('gwFilterClear');
      if (clearBtn) {
        clearBtn.onclick = () => {
          gwFilter = '';
          sel.value = '';
          refreshFaultsPanel();
        };
      }
    }

    function updateSummaryCounters() {
      if (!currentConfig) return;

      let total = 0;
      let ok = 0;
      let timeout = 0;
      let error = 0;
      let unknown = 0;

      const statusMap = buildStatusMap();

      for (const gateway of currentConfig.gateways) {
        for (const point of gateway.points) {
          total++;

          const statusPoint = statusMap.get(getPointKey(gateway.IPRS, point.ga));
          const status = statusPoint ? statusPoint.status : null;

          if (status === 1) ok++;
          else if (status === 99) timeout++;
          else if (status === -1) error++;
          else unknown++;
        }
      }

      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.innerText = value;
      };

      setText('sumTotal', total);
      setText('sumOk', ok);
      setText('sumTimeout', timeout);
      setText('sumError', error);
      setText('sumUnknown', unknown);

      const lastUpdateEl = document.getElementById('lastUpdate');

      if (lastUpdateEl) {
        lastUpdateEl.innerText = `Last system update: ${lastStatus.updated || 'n/a'}`;
      }
    }

    function updateSinglePoint(point) {
      lastLiveUpdateTime = Date.now();

      if (dashboardIsStale) {
        dashboardIsStale = false;
        setSseState('connected', 'Live connection active');
      }

      const key = getPointKey(point.ip, point.ga);

      const index = lastStatus.points.findIndex(
        p => getPointKey(p.ip, p.ga) === key
      );

      if (index >= 0) {
        lastStatus.points[index] = point;
      } else {
        lastStatus.points.push(point);
      }

      lastStatus.updated = point.updated || new Date().toISOString();

      const statusEl = document.getElementById(getStatusElementId(point.ip, point.ga));

      if (statusEl) {
        const info = getStatusInfo(point.status);

        statusEl.className = `status-badge ${info.cls}`;
        statusEl.innerText = info.text;
        statusEl.dataset.status = point.status;
      }

      const updatedEl = document.getElementById(
        `updated-${safeId(point.ip)}-${safeId(point.ga)}`
      );

      if (updatedEl) {
        updatedEl.innerText = point.updated ? formatIsrael(point.updated) : '';
      }

      updateSummaryCounters();
      refreshFaultsPanel();
    }

    function refreshFaultsPanel() {
      const faultsBody = document.getElementById('faultsBody');
      const faultsTable = document.getElementById('faultsTable');
      const faultsEmpty = document.getElementById('faultsEmpty');

      // gather faulted points (status !== 1)
      const faulted = (lastStatus.points || []).filter(p => p.status !== 1);

      if (!faulted.length) {
        faultsBody.innerHTML = '';
        faultsTable.style.display = 'none';
        faultsEmpty.style.display = 'block';
        return;
      }

      faultsTable.style.display = 'table';
      faultsEmpty.style.display = 'none';

      // apply GW filter if set
      const visible = gwFilter ? faulted.filter(p => p.ip === gwFilter) : faulted;

      const rows = visible.map(p => {
        const info = getStatusInfo(p.status);
        const key = getPointKey(p.ip, p.ga);
        const first = faultFirstSeen.has(key) ? faultFirstSeen.get(key) : (p.updated || null);
        const timeStr = first ? formatIsrael(first) : '';
        // shorten label
        const short = info.text === 'Communication Error' ? 'Error' : (info.text === 'Timeout' ? 'Timeout' : info.text);
        return `
          <tr>
            <td>${p.ga}</td>
            <td>${p.ip}</td>
            <td title="${p.dst || ''}">${p.dst || ''}</td>
            <td><span class="status-badge ${info.cls}" title="${info.text}">${short}</span></td>
            <td style="white-space:nowrap">${timeStr}</td>
          </tr>
        `;
      }).join('');

      faultsBody.innerHTML = rows;
    }

    function markDashboardAsStale() {
      if (dashboardIsStale) return;

      dashboardIsStale = true;

      document.querySelectorAll('.status-badge').forEach(el => {
        el.className = 'status-badge status-offline';
        el.innerText = 'Offline';
      });

      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.innerText = value;
      };

      setText('sumOk', 0);
      setText('sumTimeout', 0);
      setText('sumError', 0);
      setText('sumUnknown', document.querySelectorAll('.status-badge').length);

      const lastUpdateEl = document.getElementById('lastUpdate');

      if (lastUpdateEl) {
        lastUpdateEl.innerText = 'Last system update: no live data';
      }

      setSseState('error', 'No live data - server or KNX polling is offline');
    }

    function setSseState(state, customText) {
      const dot = document.getElementById('sseDot');
      const text = document.getElementById('sseText');

      dot.classList.remove('connected', 'error');

      if (state === 'connected') {
        dot.classList.add('connected');
        text.innerText = customText || 'Live connection active';
      } else if (state === 'error') {
        dot.classList.add('error');
        text.innerText = customText || 'Live connection lost - retrying automatically';
      } else {
        text.innerText = customText || 'Connecting...';
      }
    }

    function startStatusStream() {
      const eventSource = new EventSource('/api/status/stream');

      eventSource.addEventListener('connected', () => {
        lastLiveUpdateTime = Date.now();
        setSseState('connected', 'Live connection active');
      });

      eventSource.addEventListener('status-full', event => {
        lastLiveUpdateTime = Date.now();
        dashboardIsStale = false;

        lastStatus = JSON.parse(event.data);
        // initialize fault first-seen timestamps for currently faulted points
        for (const p of lastStatus.points || []) {
          const key = getPointKey(p.ip, p.ga);
          if (p.status !== 1 && !faultFirstSeen.has(key)) {
            faultFirstSeen.set(key, p.updated || new Date().toISOString());
          }
          if (p.status === 1 && faultFirstSeen.has(key)) {
            // recovered, remove first-seen
            faultFirstSeen.delete(key);
          }
        }

        setSseState('connected', 'Live connection active');
        renderDashboard();
      });

      eventSource.addEventListener('status-point', event => {
        const point = JSON.parse(event.data);
        // update first-seen map: if fault and not present, set first-seen
        const key = getPointKey(point.ip, point.ga);
        if (point.status !== 1) {
          if (!faultFirstSeen.has(key)) {
            faultFirstSeen.set(key, point.updated || new Date().toISOString());
          }
        } else {
          // recovered -> remove first seen
          if (faultFirstSeen.has(key)) faultFirstSeen.delete(key);
        }

        updateSinglePoint(point);
      });

      eventSource.onerror = () => {
        setSseState('error', 'Live connection lost - retrying automatically');
      };
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      // show password modal instead of immediate redirect
      document.getElementById('pwModal').style.display = 'flex';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwError').style.display = 'none';
      document.getElementById('pwInput').focus();
    });

    // password handling
    (function(){
      const pwOk = document.getElementById('pwOk');
      const pwCancel = document.getElementById('pwCancel');
      const pwModal = document.getElementById('pwModal');
      const pwInput = document.getElementById('pwInput');
      const pwError = document.getElementById('pwError');

      // obfuscated expected password (base64 of 'admin1234!')
      const expectedB64 = 'YWRtaW4xMjM0IQ==';

      function closeModal() {
        pwModal.style.display = 'none';
      }

      pwCancel.addEventListener('click', closeModal);

      pwOk.addEventListener('click', () => {
        const entered = pwInput.value || '';
        const b64 = btoa(entered);
        if (b64 === expectedB64) {
          // success
          closeModal();
          window.location.href = '/index.html';
        } else {
          pwError.style.display = 'block';
        }
      });

      pwInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') pwOk.click();
        if (e.key === 'Escape') closeModal();
      });
    })();

    loadInitialData();
    startStatusStream();

    setInterval(() => {
      const diff = Date.now() - lastLiveUpdateTime;

      if (diff > STALE_TIMEOUT_MS) {
        markDashboardAsStale();
      }
    }, 3000);
  </script>
</body>
</html>
